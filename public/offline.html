<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f14" />
    <title>অফলাইন · MessMate BD</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: radial-gradient(60rem 30rem at 15% -10%, rgba(45, 212, 167, 0.16), transparent 60%), #0b0f14;
        color: #e8edf3; font-family: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif; text-align: center;
      }
      .card { max-width: 380px; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 1.5rem; margin: 20px 0 8px; }
      p { color: #8b97a8; line-height: 1.7; margin: 0 0 6px; }
      button {
        margin-top: 20px; border: 0; border-radius: 12px; padding: 12px 22px; font: inherit; font-weight: 600;
        background: #2dd4a7; color: #04201a; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon.svg" alt="" />
      <h1>ইন্টারনেট সংযোগ নেই</h1>
      <p>সংযোগ ফিরে এলেই আপনার মেসের সব হিসাব আবার দেখা যাবে।</p>
      <p>You're offline. Your mess will load again once you're back online.</p>
      <button type="button" onclick="location.reload()">আবার চেষ্টা করুন</button>
    </main>
  </body>
</html>
