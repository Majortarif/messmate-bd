# Netlify detects Next.js and uses its OpenNext-based runtime automatically.
# Environment variable VALUES are set in the Netlify UI, never here: see docs/DEPLOYMENT.md.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # NEXT_PUBLIC_* values are inlined into the browser bundle by design, so the secrets
  # scanner must not treat them as leaks (even if they were marked secret in the UI).
  # SUPABASE_SECRET_KEY is deliberately NOT listed: it must never appear in the output.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPPORT_EMAIL"
