name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # No Supabase env here on purpose: the build must not depend on secrets.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    name: Migrations, RLS and functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/tests/pglite/package-lock.json
      - run: npm ci --prefix supabase/tests/pglite
      - run: npm run db:test
      - name: setup.sql is up to date
        run: git diff --exit-code supabase/setup.sql
